# Tests the Docker image on every push and pull request, then publishes it to Docker Hub
# (linux/amd64 and linux/arm64) from main and from v* tags, and syncs README.md to Docker Hub from main.
#
# Repository settings:
#   secrets.DOCKERHUB_USERNAME, secrets.DOCKERHUB_TOKEN  Docker Hub user and access token (Read, Write, Delete:
#                                                        the README sync needs Delete)
#   vars.DOCKERHUB_IMAGE                                 image name, e.g. yourname/tosstome
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'tosstome/tosstome' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tosstome:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start server
        run: |
          docker run -d --name tosstome -p 8080:8080 tosstome:test
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ && exit 0; sleep 1; done
          docker logs tosstome
          exit 1
      - name: Install test dependencies
        run: npm ci && npm ci --prefix cli
      - name: Test
        run: |
          node tests/integration.mjs http://127.0.0.1:8080
          node tests/rtc_node.mjs http://127.0.0.1:8080
          node tests/mcp.mjs http://127.0.0.1:8080
      - name: Server logs
        if: failure()
        run: docker logs tosstome

  publish:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Sync README to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: Toss files between devices from any browser. Self-hosted tosstome server.
          enable-url-completion: true
